<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tiempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; margin: 0; padding: 0; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Asegura que los inputs no se desborden */
        input { 
            max-width: 100%; 
            box-sizing: border-box; 
            appearance: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400 tracking-tight">Calculadora de Tiempo</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2 text-slate-300">Hora Inicial</label>
            <input type="time" id="horaBase" 
                   class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-xl text-center text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <div class="flex gap-4 mb-8">
            <div class="flex-1">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Horas</label>
                <input type="number" id="horasIn" placeholder="0" min="0"
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-center text-white focus:border-blue-400 outline-none">
            </div>
            <div class="flex-1">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Minutos</label>
                <input type="number" id="minutosIn" placeholder="0" min="0"
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-center text-white focus:border-blue-400 outline-none">
            </div>
        </div>

        <div class="flex gap-4 mb-8">
            <button onclick="calcular('restar')" 
                    class="flex-1 bg-red-600 hover:bg-red-500 py-4 rounded-xl font-bold transition-all shadow-lg active:scale-95 text-white">
                Restar -
            </button>
            <button onclick="calcular('sumar')" 
                    class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold transition-all shadow-lg active:scale-95 text-white">
                Sumar +
            </button>
        </div>

        <div id="contenedorResultado" class="hidden">
            <div class="text-center p-6 bg-slate-900/80 rounded-xl border border-blue-500/40">
                <p class="text-slate-400 text-sm mb-1">Hora Resultante</p>
                <span id="resultado" class="text-5xl font-black text-white">--:--</span>
                <p id="infoDia" class="text-sm mt-2 text-blue-300 font-medium"></p>
            </div>
        </div>
    </div>

    <script>
        // Establecer hora actual por defecto al iniciar
        window.onload = () => {
            const ahora = new Date();
            const h = String(ahora.getHours()).padStart(2, '0');
            const m = String(ahora.getMinutes()).padStart(2, '0');
            document.getElementById('horaBase').value = `${h}:${m}`;
        };

        function calcular(operacion) {
            const inputHora = document.getElementById('horaBase').value;
            const addH = parseInt(document.getElementById('horasIn').value) || 0;
            const addM = parseInt(document.getElementById('minutosIn').value) || 0;

            if (!inputHora) return;

            // Base temporal
            const [h, m] = inputHora.split(':');
            let fecha = new Date();
            fecha.setHours(parseInt(h), parseInt(m), 0, 0);
            
            // Guardamos referencia para comparar cambios de día
            const msOriginal = fecha.getTime();
            const desplazamientoMs = (addH * 60 + addM) * 60000;

            // Operación
            fecha.setTime(operacion === 'sumar' ? msOriginal + desplazamientoMs : msOriginal - desplazamientoMs);

            // Formato de salida
            const resH = String(fecha.getHours()).padStart(2, '0');
            const resM = String(fecha.getMinutes()).padStart(2, '0');
            document.getElementById('resultado').innerText = `${resH}:${resM}`;
            
            // Cálculo de días de diferencia
            const d1 = new Date(msOriginal).setSeconds(0,0);
            const d2 = new Date(fecha).setSeconds(0,0);
            const diffDias = Math.round((d2 - d1) / 86400000);
            
            const infoDia = document.getElementById('infoDia');
            if (diffDias > 0) infoDia.innerText = `(+${diffDias} día${diffDias > 1 ? 's' : ''} después)`;
            else if (diffDias < 0) infoDia.innerText = `(${Math.abs(diffDias)} día${Math.abs(diffDias) > 1 ? 's' : ''} antes)`;
            else infoDia.innerText = "Mismo día";

            document.getElementById('contenedorResultado').classList.remove('hidden');
        }
    </script>
</body>
</html>
