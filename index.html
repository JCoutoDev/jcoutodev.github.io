<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCalc - Calculadora de Tiempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">Calculadora de Tiempo</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Hora Inicial (o actual)</label>
            <input type="time" id="horaBase" 
                   class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-xl text-center focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Horas</label>
                <input type="number" id="horasIn" placeholder="0" min="0"
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-center focus:border-blue-400 outline-none">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Minutos</label>
                <input type="number" id="minutosIn" placeholder="0" min="0"
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-center focus:border-blue-400 outline-none">
            </div>
        </div>

        <div class="flex gap-4 mb-8">
            <button onclick="calcular('restar')" 
                    class="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold transition-colors shadow-lg active:scale-95">
                Restar -
            </button>
            <button onclick="calcular('sumar')" 
                    class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold transition-colors shadow-lg active:scale-95">
                Sumar +
            </button>
        </div>

        <div id="contenedorResultado" class="hidden animate-pulse">
            <div class="text-center p-4 bg-slate-900/50 rounded-lg border border-blue-500/30">
                <p class="text-slate-400 text-sm mb-1">Hora Resultante</p>
                <span id="resultado" class="text-4xl font-black text-white">--:--</span>
                <p id="infoDia" class="text-xs mt-2 text-blue-300 font-medium"></p>
            </div>
        </div>
    </div>

    <script>
        // 1. Establecer hora actual por defecto al cargar
        window.onload = () => {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            document.getElementById('horaBase').value = `${horas}:${minutos}`;
        };

        // 2. Lógica de cálculo
        function calcular(operacion) {
            const inputHora = document.getElementById('horaBase').value;
            const addH = parseInt(document.getElementById('horasIn').value) || 0;
            const addM = parseInt(document.getElementById('minutosIn').value) || 0;

            if (!inputHora) return;

            // Crear objeto fecha basado en el input (usamos fecha de hoy como base)
            const [h, m] = inputHora.split(':');
            let fecha = new Date();
            fecha.setHours(parseInt(h), parseInt(m), 0, 0);

            // Guardar el día original para saber si cambió
            const diaOriginal = fecha.getDate();

            // Convertir el tiempo introducido a milisegundos
            const desplazamientoMs = (addH * 60 + addM) * 60000;

            if (operacion === 'sumar') {
                fecha.setTime(fecha.getTime() + desplazamientoMs);
            } else {
                fecha.setTime(fecha.getTime() - desplazamientoMs);
            }

            // Formatear salida
            const resH = String(fecha.getHours()).padStart(2, '0');
            const resM = String(fecha.getMinutes()).padStart(2, '0');
            
            // Mostrar resultado
            document.getElementById('resultado').innerText = `${resH}:${resM}`;
            
            // Lógica para indicar si es otro día
            const infoDia = document.getElementById('infoDia');
            const diferenciaDias = fecha.getDate() - diaOriginal;
            
            if (diferenciaDias > 0) {
                infoDia.innerText = `(+${diferenciaDias} día${diferenciaDias > 1 ? 's' : ''} después)`;
            } else if (diferenciaDias < 0) {
                infoDia.innerText = `(${Math.abs(diferenciaDias)} día${Math.abs(diferenciaDias) > 1 ? 's' : ''} antes)`;
            } else {
                infoDia.innerText = "Mismo día";
            }

            // Mostrar el contenedor con una pequeña animación
            const container = document.getElementById('contenedorResultado');
            container.classList.remove('hidden');
            container.classList.remove('animate-pulse');
            void container.offsetWidth; // Trigger reflow
            container.classList.add('animate-bounce-short'); // Podrías añadir custom anims
        }
    </script>
</body>
</html>
